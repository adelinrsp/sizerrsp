[build]
  command = "npm run build"
  publish = ".next"

# Runtime Next.js v5 : transforme les routes /api/* en fonctions Netlify et
# gère le rendu à la demande des pages serveur.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Les routes /api/* interrogent Google et ne doivent jamais être mises en cache.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
